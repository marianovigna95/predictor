# Auto-aggiornamento giornaliero del sito statico su GitHub Pages (repo pubblico, gratis).
# ⏰ 16/11 — orari RICOSTRUITI su quando si gioca davvero.
#    GitHub ritarda i cron di 20-90 minuti: gli orari sotto sono scelti perche'
#    l'esecuzione REALE cada nel momento giusto, non per far bello il numero.
#    (misurato: 06:30 -> parte 07:30 · 12:30 -> parte 13:25 · 18:30 -> parte 19:15 · 22:00 -> parte 22:22)
name: daily-predictor
on:
  schedule:
    # ⏰ 16/11-b — da 5 a 4 run: NON si perde copertura del sito, si guadagna un esito in piu'.
    #    Motivo: step20_eval_day riscrive l'esito di OGGI (non di ieri). Due run a meno di
    #    ~3 ore di distanza vedono lo stesso stato (partite non ancora giocate) → la seconda
    #    non aggiunge un esito ma consuma comunque una richiesta ADM.
    #    Con 4 run in due coppie distanti 3h si ottengono 2 esiti al giorno (pomeriggio e sera)
    #    invece di 1, spendendo il 20% in meno di budget ADM (4×3 = 12 richieste/giorno).
    #
    # 06:00 UTC = 07:00 IT -> parte ~08:00. Quote appena aperte, molte partite quotate.
    - cron: "0 6 * * *"
    # 13:00 UTC = 14:00 IT -> parte ~14:45. ⭐ SLOT MIGLIORE: mercato formato, 6h di margine
    #    prima delle partite serali. E' qui che il sito deve essere piu' fresco.
    - cron: "0 13 * * *"
    # 17:30 UTC = 18:30 IT -> parte ~19:15. Ultimo aggiornamento utile prima dei match
    #    18:30-21:00 (prima era alle 19:30 -> partiva alle 20:15, troppo tardi).
    - cron: "30 17 * * *"
    # 21:15 UTC = 22:15 IT -> parte ~22:45. Verifica esiti delle partite serali
    #    (finite ~22:40) + CLV + surebets + alert. Ultima rete di sicurezza: 23:00 IT.
    - cron: "15 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara layout progetto (src/, data/, site/)
        run: |
          mkdir -p src data site
          # i .py caricati via web sono a root: spostali in src/ (gli script calcolano ROOT = parent di src)
          mv *.py src/ 2>/dev/null || true
          # in alternativa, se presente, estrai anche lo zip del codice
          if [ -f predictor-src.zip ]; then python3 -c "import zipfile; zipfile.ZipFile('predictor-src.zip').extractall('src')"; fi
          # dati storici (CSV) compressi nel repo: estraili in data/
          if [ -f predictor-data.zip ]; then python3 -c "import zipfile; zipfile.ZipFile('predictor-data.zip').extractall('.')"; fi
          ls src | head -5; ls data | head -5; du -sh data
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pandas numpy scikit-learn requests fpdf2 pymupdf
      # 🆕 19/11 Python non deve scrivere __pycache__ nel repo: 12 file .pyc
      #    venivano committati a ogni run (cambiano sempre → diff sempre "modificato").
      - run: echo "PYTHONDONTWRITEBYTECODE=1" >> $GITHUB_ENV
      - name: Pipeline mattina/sera (fonti keyless; step con throttling non bloccanti)
        env:
          # 🆕 14/11 secret -> variabile d'ambiente letta da src/step31_quote_adm.py
          #    Se il secret non esiste, la variabile è vuota: lo script salta senza errori.
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
        run: |
          D=$(date +%F)
          python3 src/step1b_fixtures_leagues.py || true
          python3 src/step1f_internationals.py || true                  # 🆕 10/11 nazionali: calendario ESPN + storico kaggle
          python3 src/step22b_window.py --days 7 || true               # 🆕 10/11 quote best-price per TUTTA la finestra mobile oggi→+7 (wincomparator)
          python3 src/step22_odds_refresh.py --date $D || true          # refresh quote di oggi (file finestra precedente)
          python3 src/step1c_verify_espn.py $D || true                  # verifica esiti ESPN
          # 🆕 14/11 FIX: prima si verificava SOLO il giorno corrente, quindi le partite
          #   di ieri restavano per sempre senza esito ("⏳ in verifica").
          #   Ora si ri-verificano oggi + i 3 giorni precedenti (recupera i buchi).
          for i in 0 1 2 3; do
            python3 src/step20_eval_day.py --date $(date -d "-$i day" +%F) || true
          done
          python3 src/step15_betarchives.py --since $(date -d "yesterday" +%F) || true
          python3 src/step11_clv.py || true
          python3 src/step30_weather.py || true   # 🆕 13/11 meteo+coordinate (open-meteo, gratis)
          python3 src/weekly_multi.py || true
          # 🆕 16/11 MOTORE DEI PRONOSTICI: il più probabile per partita su 1X2 + O/U + GG/NG
          #    gira dopo weekly_multi (usa forecast_multi.csv) e aggiorna anche il bilancio
          python3 src/step35_motore.py || true
          python3 src/step19_diretta.py || true
          python3 src/step21_surebets.py $D || true
          python3 src/step26_telegram.py --date $D --min 1.0 || true    # alert Telegram se env impostate
          python3 src/step27_schedina.py --date $D || true              # 🧾 schedina del giorno (html+pdf)
          python3 src/step28_bankroll.py || true                        # 💰 pagina tracker bankroll
          python3 src/step29_squadra.py || true                          # 🔎 pagina cerca squadra
          python3 src/validate_multi.py --from-md 6 --to-md 38 || true   # 🆕 13/11 validazione estesa -> benchmark.html sempre fresco
          python3 src/step31_quote_adm.py || true                      # 🆕 13/11-b quote ADM reali (senza chiave: skip pulito)
          python3 src/step32_confronto_adm.py || true                  # 🆕 14/11 confronto INTERNO best-price vs ADM (solo data/, mai sul sito)
          # 🆕 16/11 BACKTEST ONESTO + BASELINE MERCATO PURO
          #    step6 genera predictions_ensemble.csv (walk-forward) che step33 legge.
          #    step33 produce bets_1x2_onesto.csv / _meta.json / bench_mercato_puro.csv.
          #    Prima NON erano nel workflow: il fix "baseline mercato puro" non girava mai.
          python3 src/step6_ensemble.py || true
          python3 src/step33_bench_giocate.py || true
          python3 src/make_site.py || true
          python3 src/step23_ppa.py --minp 60 --topn 30 || true
          python3 src/step24_ppa_pdf.py --minp 60 || true
          python3 src/step25_verifica_mensile.py || true
          python3 src/step29_bench_pinnacle.py || true                # 🆕 13/11-b bench vs quota sharp -> data/bench_pinnacle.csv
          python3 src/step30_meta.py || true                          # 🆕 13/11-b meta description/OG + anonimizzatore fonti (ULTIMO passo, tocca tutte le pagine)
      - name: 🩺 Controllo di salute dei dati (fallisce se sono vecchi)
        # ⚠️ VOLUTAMENTE senza "|| true": se i dati non sono freschi la run deve
        #    diventare ROSSA. Meglio un allarme che un sito fermo in silenzio.
        run: python3 src/step36_check.py

      - name: Pubblica su GitHub Pages (root del repo)
        run: |
          cp site/*.html site/manifest.webmanifest site/sw.js site/icon-*.png . 2>/dev/null || true
          cp site/fixtures.json . 2>/dev/null || true
          cp site/ppa_*.pdf . 2>/dev/null || true
          # 🆕 13/11-b anti-doppioni: i .py in root sono solo la copia di lavoro, la fonte è src/
          # 🆕 19/11 aggiunti __pycache__/ e *.pyc: la regola '!src/**' li riammetteva,
          #    quindi finivano nel commit a ogni run.
          printf '%s\n' '# copie di lavoro dei .py in root (la fonte è src/): non versionare' '*.py' '!src/**' '!*/*.py' '__pycache__/' '*.pyc' '*.pyo' > .gitignore
          # 🆕 19/11 rotazione archivi datati + pulizia dei __pycache__ già committati
          python3 src/step37_rotazione.py || true
          git rm -r --cached --ignore-unmatch src/__pycache__ >/dev/null 2>&1 || true
          rm -rf src/__pycache__ || true
          git config user.email "bot@arena.ai" && git config user.name "predictor-bot"
          git add -A && git commit -m "auto-update $(date -u +%F_%H:%M)" || echo "nessuna modifica"
          git push
